<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="jogo.nome">Lady and Gentlemen</title>
  <link rel="stylesheet" href="estilo.css?v=202610191014">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body>
  <div id="palco">
    <div id="app">
      <main id="mesa">
        <section class="zona zona-op">
          <div class="info" id="info-1"></div>
          <div class="mao" id="mao-1"></div>
          <div class="pilhas" id="pilhas-1"></div>
        </section>
        <section class="fileira" id="campo-1"></section>
        <div id="acoes" hidden></div>
        <aside id="combate" hidden></aside>
        <section id="faixa">
          <div id="fase"></div>
          <div id="instrucao"></div>
          <div id="chips"></div>
          <div id="botoes"></div>
        </section>
        <section class="fileira" id="campo-0"></section>
        <section class="zona zona-eu">
          <div class="info" id="info-0"></div>
          <div class="mao" id="mao-0"></div>
          <div class="pilhas" id="pilhas-0"></div>
        </section>
      </main>
      <svg id="setas" width="1470" height="940"></svg>
      <div id="anuncio" hidden></div>
      <aside id="painel">
        <div class="barra-partida">
          <button class="btn" data-acao="reiniciar" data-i18n="barra.reiniciar" data-i18n-title="barra.reiniciarT">⟲ Restart</button>
          <button class="btn" data-acao="desistir" data-i18n="barra.desistir" data-i18n-title="barra.desistirT">⚑ Concede</button>
          <button class="btn" data-acao="menu" data-i18n="barra.menu" data-i18n-title="barra.menuT">☰ Menu</button>
        </div>
        <h2 data-i18n="barra.registro">Log</h2>
        <div id="log"></div>
      </aside>
    </div>
  </div>
  <div id="modal" hidden></div>
  <div id="dica" hidden></div>

  <script src="js/idioma.js?v=202610191014"></script>
  <script src="js/motor.js?v=202610191014"></script>
  <script src="js/palhacos.js?v=202610191014"></script>
  <script src="js/bot.js?v=202610191014"></script>
  <script src="js/cartas.js?v=202610191014"></script>
  <script src="js/dados3d.js?v=202610191014"></script>
  <script src="js/decks.js?v=202610191014"></script>
  <script src="js/regras.js?v=202610191014"></script>
  <script src="js/rede.js?v=202610191014"></script>
  <script src="js/interface.js?v=202610191014"></script>
</body>
</html>
